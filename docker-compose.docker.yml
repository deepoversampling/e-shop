services:

  postgres:
    container_name: postgres-shop
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: shop_db
    volumes:
      - postgres-vol:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - shop-net
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin-shop
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.com
      PGADMIN_DEFAULT_PASSWORD: pass
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin-vol:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - shop-net
    restart: unless-stopped

  keycloak:
    container_name: keycloak-shop
    image: keycloak/keycloak:26.0.0
    ports:
      - "9080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: pass
    volumes:
      - keycloak-local-vol:/opt/keycloak/data
    networks:
      - shop-net
    command:
      - "start-dev"

  redis:
    container_name: redis-shop
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-vol:/data
    networks:
      - shop-net
    restart: unless-stopped

  redis-insight:
    container_name: redis-insight-shop
    image: redis/redisinsight
    ports:
      - "5540:5540"
    networks:
      - shop-net
    depends_on:
      - redis

  backend:
    build:
      context: /shop
      dockerfile: ../docker/backend/Dockerfile
    image: eshop/eshop:1.0.0
    ports:
      - "8080:8080"
    networks:
      - shop-net
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-shop:5432/shop_db
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWK_SET_URI: http://keycloak-shop:8080/realms/e-shop/protocol/openid-connect/certs
      SPRING_DATA_REDIS_HOST: redis-shop
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
      - keycloak

networks:
  shop-net:
    driver: bridge

volumes:
  postgres-vol:
  pgadmin-vol:
  keycloak-local-vol:
  redis-vol:
    driver: local