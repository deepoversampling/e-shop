name: Frontend Pipeline

on:
  push:
    branches:
      - main
    paths:
      - shop-ui/**
      - docker/frontend/**
      - docker-compose.prod.yml
      - .github/workflows/pipeline-frontend.yml

jobs:
  build-image:
    name: Build frontend Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract frontend project version
        id: extract_version
        run: |
          cd shop-ui
          echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: shop-ui
          file: docker/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/eshop-ui:${{ steps.extract_version.outputs.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/eshop-ui:latest

  deploy:
    name: Deploy frontend
    runs-on: self-hosted
    needs: build-image

    steps:
      - name: TODO
        run: echo "frontend1"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create /tmp/eshop.pem (private key) on self-hosted runner
        run: echo "${{ secrets.PEM_KEY }}" > /tmp/eshop.pem

      - name: Set /tmp/eshop.pem permissions
        run: chmod 600 /tmp/eshop.pem

      - name: Create /home/ec2-user/prod (deployment folder) on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/eshop.pem ec2-user@44.202.154.133 \
          "mkdir -p /home/ec2-user/prod"

      - name: Copy docker-compose to EC2 deployment folder
        run: |
          scp -o StrictHostKeyChecking=no -i /tmp/eshop.pem docker-compose.prod.yml ec2-user@44.202.154.133:/home/ec2-user/prod/docker-compose.prod.yml

      - name: Copy nginx.conf to EC2 deployment folder
        run: |
          scp -o StrictHostKeyChecking=no -i /tmp/eshop.pem nginx.conf ec2-user@44.202.154.133:/home/ec2-user/prod/nginx.conf

      - name: Copy .env to EC2 deployment folder
        run: |
          echo "${{ secrets.ENV_FILE }}" > /tmp/.env
          scp -o StrictHostKeyChecking=no -i /tmp/eshop.pem /tmp/.env ec2-user@44.202.154.133:/home/ec2-user/prod/.env

      - name: Copy postgresql.conf to EC2 deployment folder
        run: |
          scp -o StrictHostKeyChecking=no -i /tmp/eshop.pem postgresql.conf ec2-user@44.202.154.133:/home/ec2-user/prod/postgresql.conf

      - name: Copy config.json to EC2 deployment folder
        run: |
          scp -o StrictHostKeyChecking=no -i /tmp/eshop.pem config.json ec2-user@44.202.154.133:/home/ec2-user/prod/config.json

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/eshop.pem ec2-user@44.202.154.133 << 'EOF'
          cd /home/ec2-user/prod
          docker-compose -f docker-compose.prod.yml pull -q
          docker-compose -f docker-compose.prod.yml up -d
          EOF