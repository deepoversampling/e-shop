name: e-shop Backend API Pipeline

on:
  push:
    branches:
      - main
    paths:
      - shop/**
      - docker/backend/**
      - docker-compose.prod.yml
      - .github/workflows/pipeline-backend.yml

jobs:
  build-image:
    name: Build backend Docker image
    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: shop_db
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'

      - name: Build backend
        run: |
          cd shop
          chmod +x mvnw
          ./mvnw clean package

      - name: Extract project version
        id: extract_version
        run: |
          cd shop
          echo "VERSION=$(./mvnw -q -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: shop
          file: docker/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/eshop-api:${{ steps.extract_version.outputs.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/eshop-api:latest

  deploy:
    name: Deploy Backend
    runs-on: self-hosted
    needs: build-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create PEM Key File
        run: echo "${{ secrets.PEM_KEY }}" > /tmp/pem_key.pem

      - name: Fix PEM permissions
        run: chmod 600 /tmp/pem_key.pem

      - name: Create deployment folder on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/pem_key.pem ec2-user@44.220.159.217 \
          "mkdir -p /home/ec2-user/prod"
          
      - name: Copy docker-compose to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i /tmp/pem_key.pem docker-compose.prod.yml ec2-user@44.220.159.217:/home/ec2-user/prod/docker-compose.prod.yml

      - name: Copy nginx.conf to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i /tmp/pem_key.pem nginx.conf ec2-user@44.220.159.217:/home/ec2-user/prod/nginx.conf

      - name: Upload .env to EC2
        run: |
          echo "${{ secrets.ENV_FILE }}" > /tmp/envfile.tmp
          scp -o StrictHostKeyChecking=no -i /tmp/pem_key.pem /tmp/envfile.tmp ec2-user@44.220.159.217:/home/ec2-user/prod/.env

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/pem_key.pem ec2-user@44.220.159.217 << 'EOF'
          cd /home/ec2-user/prod
          docker-compose -f docker-compose.prod.yml pull -q
          docker-compose -f docker-compose.prod.yml up -d
          EOF