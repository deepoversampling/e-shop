name: e-shop Backend API Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-image:
    name: Build backend Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'

      - name: Build project backend
        run: |
          cd shop
          chmod +x shop/mvnw
          ./mvnw clean package

      - name: Extract project version
        id: extract_version
        run: |
          cd shp
          echo "VERSION=$(./mvnw -q -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: shop
          file: docker/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/eshop-api:${{ steps.extract_version.outputs.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/eshop-api:latest

  deploy:
    name: Deploy Backend
    runs-on: self-hosted
    needs: build-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create PEM Key File
        run: echo "${{ secrets.PEM_KEY }}" > /tmp/pem_key.pem

      - name: Fix PEM permissions
        run: chmod 600 /tmp/pem_key.pem
          
      - name: Copy docker-compose to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i /tmp/pem_key.pem docker-compose.prod.yml ec2-user@13.223.46.61:~/ci-cd/docker-compose.prod.yml

      - name: Deploy on EC2
        run: |
          scp -o StrictHostKeyChecking=no -i /tmp/pem_key.pem << 'EOF'
          cd ~/ci-cd
          
          docker-compose -f docker-compose.prod.yml pull -q
          docker-compose -f docker-compose.prod.yml up -d
          EOF

#             docker-compose pull
#            docker-compose up -d