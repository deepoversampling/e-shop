<app-menu></app-menu>

@if (isReady) {
  <!-- Carts and new cart button -->
  <div class="flex-row mt-menu">
    <!-- Carts -->
    <div class="flex-col">
      @for (cart of carts; track cart.id) {
        @if (!cart.isPaid) {
          <div
            class="border-full-one flex-col item-card"
            [class.active]="isActive(cart)"
            [class.collapsed]="!isVisible(cart)"
          >
            <!-- Cart or thumbnails -->
            <div
              appExpandable
              [expanded]="isVisible(cart)"
              [changed]="false"
              [count]="getCount(cart)"
            >
              <app-cart-card [cart]="cart"></app-cart-card>
            </div>
            @if (!isVisible(cart) && hasItems(cart)) {
              <div class="flex-row justify-center pt-half">
                <app-thumbnail-bar
                  [input]="cart"
                  [scroll]="getScroll(cart)"
                  [thumbnailsCount]="thumbnailsCount"
                  (scrollChange)="setScroll(cart, $event)"
                ></app-thumbnail-bar>
              </div>
            }
            <!-- Footer -->
            <div class="footer p-half">
              <!-- Cart summary -->
              <h2 class="color-off-white">{{ `Total: ${getTotal(cart)}` }}</h2>
              <!-- Pay button -->
              <button
                class="btn btn-dodgers-blue btn-static"
                type="button"
                [disabled]="!isCartValid(cart) || !hasItems(cart)"
                (click)="pay(cart)"
              >Pay
              </button>
              <!-- Icons -->
              <div class="flex-row ml-auto">
                <!-- Status icons -->
                @if (!isCartValid(cart)) {
                  <div class="icon-info color-bright-orange">
                    <i
                      class="fa-solid fa-exclamation-circle"
                      [attr.data-content]="'Cart has missing or out of stock products'"
                    ></i>
                  </div>
                }
                <!-- Action icons -->
                <div class="icon-info color-red-sox-red">
                  <i
                    class="fa-solid fa-trash-alt"
                    [attr.data-content]="'Remove cart'"
                    (click)="removeCart(cart)"
                  ></i>
                </div>
                @if (isActive(cart)) {
                  <div class="icon-info color-mcdonalds-yellow">
                    <i
                      class="fa-solid fa-toggle-on"
                      [attr.data-content]="'Cart is active'"
                    ></i>
                  </div>
                } @else {
                  <div class="icon-info color-mcdonalds-yellow">
                    <i
                      class="fa-solid fa-toggle-off"
                      [attr.data-content]="'Activate cart'"
                      (click)="activateCart(cart)"
                    ></i>
                  </div>
                }
                @if (isVisible(cart)) {
                  <div class="icon-info color-mcdonalds-yellow">
                    <i
                      class="fa-solid fa-eye-low-vision"
                      [attr.data-content]="'Collapse cart'"
                      (click)="changeVisibility(cart)"
                    ></i>
                  </div>
                } @else {
                  <div class="icon-info color-mcdonalds-yellow">
                    <i
                      class="fa-solid fa-eye"
                      [attr.data-content]="'Expand cart'"
                      (click)="changeVisibility(cart)"
                    ></i>
                  </div>
                }
              </div>
            </div>
          </div>
        }
      }
    </div>

    <!-- New cart button -->
    <button
      class="btn btn-forest-green btn-static btn-action align-self-end"
      [attr.data-content]="'Create new cart'"
      type="button"
      (click)="createCart()"
    >
      <i class="fa-solid fa-cart-plus"></i>
    </button>

  </div>
}
