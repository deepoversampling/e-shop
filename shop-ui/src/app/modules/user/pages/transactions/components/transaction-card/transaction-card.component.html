@for (item of cart().items; track item.id) {
  <div class="flex-row item">
    <div class="img-wrapper">
      <img
        [ngSrc]="getNgSrc(item)"
        fill
        alt="Product image"
        appImgErrorHandler
      />
    </div>
    <div class="flex-col pt-half pb-half gap-half flex-fill">
      <h3>{{ getTitle(item) }}</h3>
      <p>{{ item.productSnapshot?.description }}</p>
      <ul>
        @for (property of getItemProperties(item); track property) {
          <li>
            <span>{{ property }}</span>
          </li>
        }
      </ul>
    </div>
  </div>
  <!-- Item separator -->
  @if (!$last) {
    <hr>
  }
}
