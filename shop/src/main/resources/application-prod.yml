spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: postgres
    password: pass
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWK_SET_URI}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        format_sql: true
    cors:
      origins: http://localhost
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    enabled: true
    user: postgres
    password: pass
    baseline-description: "init"
    baseline-version: 0

springdoc:
  default-produces-media-type: application/json

aws:
  region: us-east-1
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket-name: e-shop-image-bucket
    base-url: https://s3.us-east-1.amazonaws.com
  cloud-formation:
    api-endpoint: https://d2y2m9vdp01cgn.cloudfront.net

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  endpoint-secret: ${STRIPE_ENDPOINT_SECRET}

application:
  backend-base-url: http://localhost
  frontend-base-url: http://localhost

server:
  port: 8080