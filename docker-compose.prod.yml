services:

  postgres:
    container_name: postgres-shop
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: shop_db
    volumes:
      - postgres-vol:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    networks:
      - shop-net
    restart: unless-stopped

  keycloak:
    container_name: keycloak-shop
    image: keycloak/keycloak:26.0.0
    ports:
      - "9080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: pass
      JAVA_OPTS_KC_HEAP: "-Xms512m -Xmx1024m"
    volumes:
      - keycloak-vol:/opt/keycloak/data
    networks:
      - shop-net
    command:
      - "start-dev"

  redis:
    container_name: redis-shop
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-vol:/data
    networks:
      - shop-net
    restart: unless-stopped

  backend:
    container_name: backend-shop
    image: javuar/eshop-api:latest
    ports:
      - "8080:8080"
    networks:
      - shop-net
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-shop:5432/shop_db
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWK_SET_URI: http://keycloak-shop:8080/realms/e-shop/protocol/openid-connect/certs
      SPRING_DATA_REDIS_HOST: redis-shop
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      - postgres
      - redis
      - keycloak

  frontend:
    container_name: frontend-shop
    image: javuar/eshop-ui:latest
    expose:
      - "4000"
    networks:
      - shop-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    networks:
      - shop-net

networks:
  shop-net:
    driver: bridge

volumes:
  postgres-vol:
  pgadmin-vol:
  keycloak-vol:
  redis-vol:
    driver: local